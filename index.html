<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="سرکار — دفتر مدیریت آفلاین کار در عراق: شمارش روزهای اقامت، حقوق و اضافه‌کاری، تقویم شمسی و میلادی، بدهی و مرخصی">
  <title>سرکار | دفتر کار عراق</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    (function () {
      try {
        var s = (JSON.parse(localStorage.getItem('sarkar-db-v1') || '{}').settings || {}).theme || 'auto';
        var dark = s === 'dark' || (s === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-icon" aria-hidden="true"><path d="M4 16.5 12 13l8 3.5V19H4v-2.5Z"/><path d="M7.5 13V9a4.5 4.5 0 0 1 9 0v4"/><path d="M12 4.5V7"/></svg>
      <div>
        <div class="brand-title">سرکار</div>
        <div class="brand-sub">دفتر کار عراق</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="install-btn" data-action="install" hidden title="نصب اپلیکیشن">
        <svg viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4"/><path d="M4.5 19h15"/></svg>
      </button>
      <button class="icon-btn" data-action="open-settings" title="تنظیمات">
        <svg viewBox="0 0 24 24"><path d="M4 7h8M16 7h4M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="page" class="page"></main>

  <nav class="bottomnav" id="bottomnav">
    <button class="nav-btn" data-page="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.75 21v-5.5h4.5V21"/></svg>
      <span>خانه</span>
    </button>
    <button class="nav-btn" data-page="days">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.75h17M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg>
      <span>روزها</span>
    </button>
    <button class="nav-btn" data-page="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 20v-6M12 20V9.5M17 20v-9"/></svg>
      <span>آمار</span>
    </button>
    <button class="nav-btn" data-page="salary">
      <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6.3 12h.01M17.7 12h.01"/></svg>
      <span>حقوق</span>
    </button>
    <button class="nav-btn" data-page="debt">
      <svg viewBox="0 0 24 24"><path d="M6.5 3.5h11V20l-1.8-1.3-1.7 1.3-1.7-1.3L10.5 20l-1.7-1.3L6.5 20V3.5Z"/><path d="M9.5 8h5M9.5 11.5h5"/></svg>
      <span>بدهی</span>
    </button>
  </nav>

  <div id="sheets"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/jalali.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
